name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          IMAGE=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_BACKEND_REPOSITORY }}:latest
          docker buildx build --platform linux/amd64 -t "$IMAGE" ./backend --push
      - run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_BACKEND_SERVICE }}" \
            --force-new-deployment

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: |
          IMAGE=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_FRONTEND_REPOSITORY }}:latest
          docker buildx build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ vars.NEXT_PUBLIC_API_BASE_URL }}" \
            -t "$IMAGE" ./frontend --push
      - run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_FRONTEND_SERVICE }}" \
            --force-new-deployment
      - name: Wait for frontend deployment
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_FRONTEND_SERVICE }}"
      - name: Sync custom domain listener rule
        run: |
          SOURCE_RULE_ARN=$(aws elbv2 describe-rules \
            --listener-arn "${{ vars.ALB_HTTPS_LISTENER_ARN }}" \
            --query "Rules[?Conditions[?Field=='host-header' && contains(Values, '${{ vars.FRONTEND_ECS_HOST }}')]].RuleArn | [0]" \
            --output text)

          if [ "$SOURCE_RULE_ARN" = "None" ] || [ -z "$SOURCE_RULE_ARN" ]; then
            echo "Could not find ECS frontend listener rule for ${{ vars.FRONTEND_ECS_HOST }}"
            exit 1
          fi

          SOURCE_ACTIONS=$(aws elbv2 describe-rules \
            --rule-arns "$SOURCE_RULE_ARN" \
            --query "Rules[0].Actions" \
            --output json)

          aws elbv2 modify-rule \
            --rule-arn "${{ vars.FRONTEND_CUSTOM_DOMAIN_RULE_ARN }}" \
            --actions "$SOURCE_ACTIONS"
