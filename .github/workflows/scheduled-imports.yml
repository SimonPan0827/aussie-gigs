name: Scheduled Imports

on:
  schedule:
    # 2am AEST / 3am AEDT. GitHub cron uses UTC.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      ticketmaster_states:
        description: "Comma-separated AU state codes for Ticketmaster"
        required: false
        default: "ACT,NSW,NT,QLD,SA,TAS,VIC,WA"
      ticketmaster_page_size:
        description: "Ticketmaster page size"
        required: false
        default: "100"

concurrency:
  group: scheduled-imports
  cancel-in-progress: false

jobs:
  ticketmaster:
    name: Ticketmaster Upcoming Events
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      TICKETMASTER_SYNC_STATES: ${{ github.event.inputs.ticketmaster_states || vars.TICKETMASTER_SYNC_STATES || 'ACT,NSW,NT,QLD,SA,TAS,VIC,WA' }}
      TICKETMASTER_SYNC_PAGE_SIZE: ${{ github.event.inputs.ticketmaster_page_size || vars.TICKETMASTER_SYNC_PAGE_SIZE || '100' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Sync Ticketmaster upcoming events
        run: python -m app.jobs.sync_ticketmaster
